<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Restaurant Sales Predictor{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<nav class="navbar navbar-expand-lg mb-4 sticky-top">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('home') }}">🍽️ SalesPredict</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="{{ url_for('home') }}">Predict</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('analytics_page') }}">Analytics</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('batch_predict') }}">Batch Predict</a></li>
      </ul>
      <!-- Right side is now empty, but keeps the layout balanced -->
      <ul class="navbar-nav">
      </ul>
    </div>
  </div>
</nav>

<main class="container mb-5">
  {% block content %}{% endblock %}
</main>

<footer class="text-center py-4">
  <small>Restaurant Sales Prediction System</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
